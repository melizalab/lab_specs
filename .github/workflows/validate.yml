name: validate

# Checks the JSON schemas in specs/ and validates the JSON examples in the
# markdown documents against them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Validate schemas and examples
        run: uv run --locked pytest
      - name: Build the package
        run: uv build
      - name: Check that the installed package finds and uses its schemas
        run: |
          uv run --isolated --no-project --with "$(ls dist/*.whl)[validate]" python -c "
          import melizalab_specs
          assert len(melizalab_specs.schemas()) >= 3
          melizalab_specs.validate({'\$schema': 'https://meliza.org/spec:2/pprox.json#pproc', 'events': [0.1]})
          "
      - name: Check that the README renders on PyPI
        run: uvx twine check --strict dist/*
