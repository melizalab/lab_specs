[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "melizalab-specs"
version = "0.1.0"
description = "JSON schemas for the Meliza Lab's data specifications"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "C Daniel Meliza", email = "dan@meliza.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
validate = ["jsonschema>=4.18"]

[project.urls]
Homepage = "https://github.com/melizalab/lab_specs"

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8",
    "pyyaml",
    "referencing",
]

[tool.hatch.build.targets.wheel]
packages = ["melizalab_specs"]

[tool.hatch.build.targets.wheel.force-include]
# the published specs, copied into the package
"specs" = "melizalab_specs/specs"

[tool.hatch.build.targets.sdist]
include = ["/melizalab_specs", "/specs", "/README.md"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
