[project]
name = "lab-specs"
version = "0.1.0"
description = "Meliza Lab data specifications, and validation of their examples"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.18",
    "pytest>=8",
    "referencing",
]

[tool.uv]
# a collection of specifications, not a Python package
package = false

[tool.pytest.ini_options]
addopts = "--doctest-modules"
